# 文档信息提取系统配置文件

# ============================================================
# 硬件配置
# ============================================================
hardware:
  # 运行模式（系统会自动检测最佳模式）
  # 可选值:
  #   auto        - 自动检测（推荐）
  #   gpu_metal   - Apple Silicon (M1/M2/M3) Metal 加速
  #   gpu_cuda    - NVIDIA GPU CUDA 加速
  #   intel_gpu   - Intel 核显加速（实验性）
  #   cpu         - 纯 CPU 模式
  mode: gpu_metal

  # GPU 设备 ID（多 GPU 时使用，0 表示第一块 GPU）
  device_id: 0

  # CPU 线程数（CPU 模式或数据预处理时使用）
  # 建议设置为物理核心数
  cpu_threads: 10

  # 是否启用 MKLDNN 加速（Intel CPU 优化）
  enable_mkldnn: true

# ============================================================
# OCR 引擎配置
# ============================================================
ocr:
  # 模型名称（当前使用 PaddleOCR-VL-1.6 视觉语言模型）
  model_name: "PaddleOCR-VL-1.6"

  # 注意：新版 PaddleOCR 会自动下载模型到 ~/.paddlex/official_models/
  # 如需更改模型存储位置，请使用软链接：
  # ln -s /your/custom/path ~/.paddlex

  # 是否使用角度分类器（自动纠正文字方向）
  # 推荐开启，对拍照的倾斜文档特别有效
  use_angle_cls: true

  # 识别语言
  # 可选值: ch (中英文混合)、en (英文)、french (法语)、
  #         german (德语)、korean (韩语)、japan (日语)
  lang: ch

  # 以下参数仅在配置文件中保留，但不会传递给 PaddleOCR
  # 因为新版本 API 已移除这些参数
  show_log: false
  rec_batch_num: 6
  det_db_thresh: 0.3
  det_db_box_thresh: 0.6
  det_db_unclip_ratio: 1.5
  max_side_len: 4096

# ============================================================
# 图像处理配置
# ============================================================
processing:
  # PDF 转图像的 DPI（分辨率）
  # 数值越高质量越好，但处理速度越慢
  # 推荐值:
  #   200-250  - 快速处理，适合清晰文档
  #   300      - 标准质量（推荐）
  #   350-400  - 高质量，适合模糊或小字文档
  pdf_dpi: 300

  # 是否启用图像预处理
  # 对模糊、拍照的文档有帮助，但会增加处理时间
  image_preprocessing: true

  # 是否去除图像噪点
  # 适用于: 拍照文档、低质量扫描件
  denoise: true

  # 是否增强对比度
  # 适用于: 灰暗、褪色的文档
  enhance_contrast: true

  # 是否进行二值化处理（转为黑白）
  # 适用于: 黑白扫描件、打印文档
  # 不适用于: 彩色图片、手写体
  binarization: false

# ============================================================
# 输出配置
# ============================================================
output:
  # 输出格式
  # 可选值: json、txt
  format: json

  # 是否保存中间处理图像（调试用）
  save_images: false

  # 输出目录
  output_dir: output

  # 置信度阈值（0-1）
  # 只保留置信度高于此值的识别结果
  # 推荐值:
  #   0.3-0.4  - 高召回率，保留更多结果（可能有误识别）
  #   0.5-0.6  - 平衡模式（推荐）
  #   0.7-0.8  - 高精度，只保留高置信度结果
  confidence_threshold: 0.5

# ============================================================
# 日志配置
# ============================================================
logging:
  # 日志级别
  # 可选值: DEBUG、INFO、WARNING、ERROR
  level: INFO

  # 日志文件路径
  file: /Users/ybl/Document/log/doc-arena/ocr_extractor.log
